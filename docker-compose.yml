# Local infrastructure and the full containerised app. Day-to-day dev only
# needs the database, so that is all a bare `up` starts. The app itself sits
# behind the `app` profile and has to be asked for by name.
#
#   docker compose up -d                        # dev: just the database
#   docker compose --profile app up --build     # the app as it ships, on :3000
#   docker compose --profile app down           # stop it again
#
# The profile is the point: `web` publishes :3000, which is the same port
# `npm run dev` wants. Without it, any bare `up`, any `docker compose restart`
# and Docker Desktop's own start button would quietly put a container built
# from older source on that port, and the dev server would fail to bind and
# leave you looking at a stale build wondering why your edits do nothing.
#
# `web` reads secrets from .env (SESSION_SECRET, GITHUB_CLIENT_ID/SECRET and,
# for real reviews, ANTHROPIC_API_KEY). Its entrypoint migrates the database
# before serving, so a fresh volume needs no manual step.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enhanced_review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enhanced_review}
      POSTGRES_DB: ${POSTGRES_DB:-enhanced_review}
    # Loopback only — never exposed on the LAN.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-enhanced_review}']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # Not part of a bare `up` — see the note at the top of this file. Compose
    # enables a profile automatically when a command names its service, so
    # `docker compose run --rm web …`, `logs web` and `up -d web` all still
    # work without repeating `--profile app`.
    profiles: ['app']
    build:
      context: .
      args:
        # Reported by GET /api/health.
        APP_VERSION: ${APP_VERSION:-local}
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      # Overrides whatever .env says: inside the container 127.0.0.1 is the
      # container, so the database is reached by its service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-enhanced_review}:${POSTGRES_PASSWORD:-enhanced_review}@postgres:5432/${POSTGRES_DB:-enhanced_review}
    # node is PID 1 (entrypoint.sh execs it) so signals already arrive; this
    # reaps the strays the review runner's git and SDK subprocesses leave.
    init: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
