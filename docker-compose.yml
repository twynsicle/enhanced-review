# Local stack for `enhanced-review` development.
#
# Two flows:
#   - Flow 1 (closest to prod): `docker compose up --build` runs everything.
#   - Flow 2 (fast iteration):  `docker compose up postgres` + host
#     `npm run dev`. Hot reload, talks to the same Postgres.
#
# Reset the database with `docker compose down -v` (drops the pgdata volume).

services:
  postgres:
    image: postgres:17-alpine
    container_name: enhanced-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: enhanced_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enhanced_review"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: enhanced-review:local
    container_name: enhanced-review-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/enhanced_review
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_TRUST_HOST: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REVIEW_EXECUTOR: ${REVIEW_EXECUTOR:-stub}
      REVIEW_MODEL: ${REVIEW_MODEL:-claude-haiku-4-5}
      REVIEW_TIMEOUT_MIN: ${REVIEW_TIMEOUT_MIN:-15}
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-0}
    ports:
      - "3000:3000"

volumes:
  pgdata:
