name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Reads the volta.node pin so CI and local match.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # typecheck + build + unit/web/guardrails tests + lint + format
      - run: npm run check
