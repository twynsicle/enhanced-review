name: Deploy infra

# Plan-on-PR / apply-on-merge for both Terraform modules (platform + app).
# Plan posts as a PR comment per module so the diff is visible before merge.
# Apply runs gated by the `production` GitHub Environment (required reviewer
# = maintainer) so each merge needs one approval click.
#
# Apply order: platform first, app second. The app reads platform via
# terraform_remote_state, so a single PR that affects both must apply
# platform's changes first.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy-infra.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read
  pull-requests: write # PR comments

env:
  AWS_REGION: us-west-2
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: 'true'

# Single concurrency group across plan/apply so two open PRs don't race on
# plan artifacts.
concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: platform
            artifact: tfplan-platform
            state_key: platform/terraform.tfstate
          - module: apps/enhanced-review
            artifact: tfplan-app
            state_key: apps/enhanced-review/terraform.tfstate

    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/enhanced-review-github-tf
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: enhanced-review-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.state_key }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=enhanced-review-tflock" \
            -backend-config="encrypt=true"

      - run: terraform fmt -check
      - run: terraform validate

      - name: terraform plan
        id: plan
        env:
          # App module needs this; platform ignores it. Setting it on both is harmless.
          TF_VAR_platform_state_bucket: enhanced-review-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
          # Sourced from GitHub secret SEED_GITHUB_LOGIN. Empty fallback keeps
          # the platform plan happy (the var only exists in the app module);
          # `terraform plan` warns on unused TF_VARs but doesn't fail.
          TF_VAR_seed_github_login: ${{ secrets.SEED_GITHUB_LOGIN || '' }}
        run: |
          terraform plan -no-color -out=tfplan -input=false 2>&1 | tee plan.txt
          terraform show -no-color tfplan > plan-show.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = `terraform/${{ matrix.module }}/plan-show.txt`;
            const plan = fs.readFileSync(planFile, 'utf8').slice(0, 60_000);
            const body = `### Terraform plan: \`${{ matrix.module }}\`\n\n<details><summary>Plan output</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome != 'success'
        run: exit 1

      - name: Upload plan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: terraform/${{ matrix.module }}/tfplan
          retention-days: 7

  apply-platform:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terraform/platform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/enhanced-review-github-tf
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: enhanced-review-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=enhanced-review-tflock" \
            -backend-config="encrypt=true"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-platform
          path: terraform/platform/

      - run: terraform apply -input=false tfplan

  apply-app:
    needs: apply-platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terraform/apps/enhanced-review

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/enhanced-review-github-tf
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: enhanced-review-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=apps/enhanced-review/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=enhanced-review-tflock" \
            -backend-config="encrypt=true"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-app
          path: terraform/apps/enhanced-review/

      - run: terraform apply -input=false tfplan
